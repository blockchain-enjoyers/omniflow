[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "/root/.solc/solc-0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]
remappings = [
  "solady/=lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
  "kernel/=lib/kernel/src/",
  "kernel-test/=lib/kernel/test/",
  "lib/kernel/:solady/=lib/kernel/lib/solady/src/",
  "lib/kernel/:forge-std/=lib/kernel/lib/forge-std/src/",
  "lib/kernel/:ExcessivelySafeCall/=lib/kernel/lib/ExcessivelySafeCall/src/",
  "lib/account-abstraction/:@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "account-abstraction/=lib/account-abstraction/contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
