[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "/root/.solc/solc-0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["solady/=lib/solady/src/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
